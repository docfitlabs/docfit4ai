name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    - name: Run basic tests
      run: |
        python -c "import src.docfit_core; print('Core module imports successfully')"
        python -c "import src.cli.ready4ai; print('CLI modules import successfully')"
        python -c "import src.ui.enhanced_streamlit_app; print('UI modules import successfully')"
    
    - name: Run linting (basic)
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        echo "Linting completed"

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: docfit4ai:latest

  deploy-production:
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        echo "Streamlit Cloud auto-deploys on push to main"
        echo "Repository: docfitlabs/docfit4ai"
        echo "Main file: streamlit_app.py"